<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mol3D</title>
<meta name="description" content="Type a compound name and see the molecule in 3D, with its functional groups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same layout and tokens as the "molecule drawer" viewer: search on top, one stage beside a narrow control column; stacks on phones. */
:root {
  --bg: #f5f6f2; --fg: #1c201b; --muted: #5b6358; --line: #d9ddd3;
  --stage: #e6e9e2; --dim: #c2c8bd; --accent: #8f6400; --accent-soft: #f1e3bf; --cut: #c2255c;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --fg: #e8ebe4; --muted: #9ba393; --line: #2b3028;
    --stage: #1a1d18; --dim: #3a4136; --accent: #e3b640; --accent-soft: #3a3016; --cut: #f06595; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --fg: #e8ebe4; --muted: #9ba393; --line: #2b3028;
  --stage: #1a1d18; --dim: #3a4136; --accent: #e3b640; --accent-soft: #3a3016; --cut: #f06595; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap {
  max-width: 1040px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
header { display: grid; gap: 10px; }
.picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.picker label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.picker input {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); flex: 1 1 140px; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 40px;
}
.picker button { border: 1px solid var(--line); border-radius: 8px; padding: 7px 16px; }
.count { font-size: 0.82rem; color: var(--muted); font-family: var(--mono); }
h1 { margin: 0; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.formula { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); overflow-wrap: anywhere; }
.formula b { color: var(--fg); font-weight: 500; }

.main { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage-box { display: grid; gap: 6px; min-width: 0; }
.stage {
  position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 72vh; max-width: 100%;
  background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; touch-action: none;
}
.empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 0.95rem; z-index: 1; background: var(--stage); }
.empty a { color: var(--fg); }
.hint { font-size: 0.82rem; color: var(--muted); }

.panel { display: grid; gap: 18px; min-width: 0; }
.group { display: grid; gap: 8px; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button + button { border-left: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: 0.88rem; color: var(--fg); background: transparent; border: 0; padding: 9px 10px; cursor: pointer; min-height: 40px; }
button:disabled { color: var(--muted); cursor: default; }
.chips button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; min-height: 36px; }
button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.chips button[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { border: 1px solid var(--line); border-radius: 8px; flex: 1 1 auto; }
.note { margin: 0; font-size: 0.9rem; min-height: 3.1em; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-family: var(--mono); font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }
footer { font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; overflow-wrap: anywhere; }
footer a { color: inherit; }
.mono { font-family: var(--mono); }
.err { color: var(--cut); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <form class="picker" id="search" role="search">
      <label for="q">Compound</label>
      <input id="q" type="search" placeholder="IUPAC or common name" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="go" type="submit">Show</button>
    </form>
    <h1 id="name">Mol3D</h1>
    <div class="formula" id="formula"></div>
  </header>

  <div class="main">
    <div class="stage-box">
      <div class="stage" id="stage" role="img" aria-label="3D molecular model">
        <div class="empty" id="empty">
          <div>Type a compound name above.<br>
          A systematic name like <a href="#2-methylpropan-1-ol">2-methylpropan-1-ol</a>
          or a common name like <a href="#aspirin">aspirin</a> or <a href="#caffeine">caffeine</a>.</div>
        </div>
      </div>
      <div class="hint">Drag to rotate · pinch or scroll to zoom</div>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="group">
        <div class="label">Model</div>
        <div class="seg" role="group" aria-label="Model style">
          <button data-style="ball" aria-pressed="true">Ball &amp; stick</button>
          <button data-style="stick" aria-pressed="false">Stick</button>
          <button data-style="fill" aria-pressed="false">Space-filling</button>
        </div>
      </div>
      <div class="group">
        <div class="label">Functional groups</div>
        <div class="chips" role="group" aria-label="Highlight a functional group" id="chips"></div>
        <p class="note" id="note"></p>
      </div>
      <div class="row">
        <button id="btn-h" aria-pressed="true">Show H</button>
        <button id="btn-reset">Reset view</button>
      </div>
      <div class="legend" aria-label="Element colors">
        <span><i style="background:#909090"></i>C</span>
        <span><i style="background:#ffffff"></i>H</span>
        <span><i style="background:#3050f8"></i>N</span>
        <span><i style="background:#ff0d0d"></i>O</span>
        <span><i style="background:#ffff30"></i>S</span>
        <span><i style="background:#ff8000"></i>P</span>
        <span><i style="background:#1ff01f"></i>Cl</span>
      </div>
    </div>
  </div>

  <footer id="foot" hidden>
    <div id="f-source"></div>
    <div id="f-smiles" class="mono"></div>
    <div id="f-note"></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
